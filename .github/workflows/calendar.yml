name: Calendar integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scheduling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh bin/epiplan bin/build-calendar
  eventkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/build-calendar
      - name: Check helper without requesting access or writing events
        run: printf '%s' '{"operation":"status"}' | '.build/Epiplan Calendar.app/Contents/MacOS/epiplan-calendar'
